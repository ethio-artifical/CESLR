feeder: dataset.dataloader_video.BaseFeeder
phase: train
dataset: CESLR_mini
num_epoch: 10
work_dir: ./work_dir/mini_test/
batch_size: 2
random_seed: 0
test_batch_size: 1
num_worker: 0
device: 0
log_interval: 1
eval_interval: 1
save_interval: 1
evaluate_tool: python
loss_weights:
  SeqCTC: 1.0

optimizer_args:
  optimizer: Adam
  base_lr: 0.0001
  step: [ 20, 35]
  learning_ratio: 1
  weight_decay: 0.0001
  start_epoch: 0
  nesterov: False

feeder_args:
  mode: 'train'
  datatype: 'video'
  num_gloss: -1
  drop_ratio: 1.0

model: slr_network.SLRModel
decode_mode: beam
model_args:
  num_classes: 63  # overridden at runtime from gloss_dict
  c2d_type: resnet18
  conv_type: 2
  use_bn: 1
  share_classifier: False
  weight_norm: False
