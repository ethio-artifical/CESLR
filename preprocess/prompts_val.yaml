# Appearance prompts for the held-out APPEARANCE CONDITIONS.
#
# Deliberately disjoint from prompts_train.yaml: no identity, garment or scene
# here appears there. A model trained on the training bank has never seen any of
# these looks, so WER on clips generated from this bank measures invariance to
# appearance rather than recall of appearances it was trained on.
#
# Applied to val-signer poses only. Val already holds out signers, so these clips
# vary appearance on top of an already-unseen signer -- which is what the
# per-axis columns in the results table report.

negative: >-
  blurry, out of focus, low quality, distorted hands, extra fingers, missing
  fingers, deformed limbs, extra arms, cropped head, watermark, text, multiple
  people, motion blur

axes:

  identity:
    - a teenage boy with curly hair, plain grey studio background, upper body,
      facing camera, even lighting, sharp focus
    - a bald man in his forties, plain grey studio background, upper body,
      facing camera, even lighting, sharp focus
    - a woman wearing a headscarf, plain grey studio background, upper body,
      facing camera, even lighting, sharp focus

  clothing:
    - a person wearing a black leather jacket, plain background, upper body,
      facing camera, even lighting, sharp focus
    - a person wearing an orange high-visibility vest, plain background,
      upper body, facing camera, even lighting, sharp focus
    - a person wearing a purple hooded sweatshirt, plain background, upper body,
      facing camera, even lighting, sharp focus

  background:
    - a person signing in a hospital corridor, upper body, facing camera,
      sharp focus
    - a person signing in a busy market street, upper body, facing camera,
      sharp focus
    - a person signing in a dimly lit room with warm lamplight, upper body,
      facing camera, sharp focus
